plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kangworld'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()

    maven {
        url = uri('https://jitpack.io')
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'com.github.kangworld:redis-core:1.0.0'
    implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.4.0')
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-parameter-store'
    implementation platform('software.amazon.awssdk:bom:2.31.78')
    implementation 'software.amazon.awssdk:s3'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'aws-integration', 'container'
    }
    testLogging {
        showStandardStreams = true
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs MySQL and Redis container integration tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test

    useJUnitPlatform {
        includeTags 'container'
    }

    testLogging {
        showStandardStreams = true
    }
}

tasks.register('awsIntegrationTest', Test) {
    group = 'verification'
    description = 'Runs tests that touch real AWS resources.'
    shouldRunAfter test

    useJUnitPlatform {
        includeTags 'aws-integration'
    }

    testLogging {
        showStandardStreams = true
    }
}

tasks.named('check') {
    dependsOn integrationTest
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // @AbuseLimit의 SpEL key가 #request.email처럼 메서드 파라미터명을 참조할 수 있게 한다.
    options.compilerArgs += '-parameters'
}
