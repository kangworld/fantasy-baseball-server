spring:
  application:
    name: fantasy-baseball-server
  mail:
    password:
  datasource:
    url: jdbc:h2:mem:fantasy_baseball_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG

security:
  jwt:
    secret: test-jwt-secret-for-fantasy-baseball-2026
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600

external:
  kbo:
    base-url: https://api-gw.sports.naver.com
    image-base-url: https://image.test.example.com
    schedule-cache-ttl: 10m
    record-cache-ttl: 30s
    live-game-state-cache-ttl: 15s

abuse:
  enabled: false

asset:
  storage:
    s3:
      bucket: test-player-image
      region: ap-northeast-2
      path-prefix: public
      cache-control: public, max-age=86400
