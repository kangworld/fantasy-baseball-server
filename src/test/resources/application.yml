spring:
  application:
    name: fantasy-baseball-server
  datasource:
    url: jdbc:h2:mem:fantasy_baseball_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath*:sql/schema/*.sql

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.springframework.jdbc.datasource.init: DEBUG
