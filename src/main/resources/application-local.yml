spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fantasy_baseball?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:fantasy}
    password: ${DB_PASSWORD:fantasy}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
