server:
  port: 8080

spring:
  application:
    name: fantasy-baseball-server
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

security:
  jwt:
    secret: ${JWT_SECRET:fantasy-baseball-local-secret-key-2026}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

external:
  kbo:
    base-url: ${KBO_API_BASE_URL:https://api-gw.sports.naver.com}
    image-base-url: ${KBO_IMAGE_BASE_URL:https://6ptotvmi5753.edge.naverncp.com}
    schedule-cache-ttl: 10m
    record-cache-ttl: 30s
    live-game-state-cache-ttl: 15s
    team-rank-cache-ttl: 30s

settlement:
  schedule:
    daily-cron: "${SETTLEMENT_DAILY_CRON:0 0 2 * * *}"
    zone: "${SETTLEMENT_SCHEDULE_ZONE:Asia/Seoul}"

member:
  mail:
    from: ${MEMBER_MAIL_FROM:no-reply@fantasy-baseball.local}
  signup:
    email-verification:
      code-expiration-minutes: ${SIGNUP_EMAIL_VERIFICATION_CODE_EXPIRATION_MINUTES:5}
      verified-expiration-minutes: ${SIGNUP_EMAIL_VERIFICATION_VERIFIED_EXPIRATION_MINUTES:10}

abuse:
  enabled: ${ABUSE_RATE_LIMIT_ENABLED:true}

asset:
  storage:
    s3:
      bucket: ${ASSET_S3_BUCKET:}
      region: ${ASSET_S3_REGION:ap-northeast-2}
      path-prefix: ${ASSET_S3_PATH_PREFIX:public}
      cache-control: ${ASSET_CACHE_CONTROL:public, max-age=86400}
