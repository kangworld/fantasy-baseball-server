server:
  port: 8080

spring:
  application:
    name: fantasy-baseball-server
  cloud:
    aws:
      parameterstore:
        enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/fantasy_baseball?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:fantasy}
    password: ${SPRING_DATASOURCE_PASSWORD:fantasy}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
      timeout: 3s
  mail:
    host: smtp.gmail.com
    port: 587
    username: fantasybaseballkr@gmail.com
    password: ${MAIL_PASSWORD:temporary-mail-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

security:
  jwt:
    secret: ${JWT_SECRET:fantasy-baseball-local-jwt-secret-key-2026}
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600

external:
  kbo:
    base-url: https://api-gw.sports.naver.com
    image-base-url: https://6ptotvmi5753.edge.naverncp.com
    schedule-cache-ttl: 10m
    record-cache-ttl: 30s
    live-game-state-cache-ttl: 15s
    team-rank-cache-ttl: 30s

settlement:
  schedule:
    daily-cron: "0 0 2 * * *"
    zone: "Asia/Seoul"

member:
  mail:
    from: fantasybaseballkr@gmail.com
  signup:
    email-verification:
      code-expiration-minutes: 5
      verified-expiration-minutes: 10

abuse:
  enabled: true

asset:
  storage:
    s3:
      bucket: ${ASSET_S3_BUCKET:fantasy-baseball-dev-979769296786-ap-northeast-2-an}
      region: ap-northeast-2
      path-prefix: public
      cache-control: public, max-age=86400

redis:
  core:
    host: redis
    port: 6379
    namespace: fantasy-baseball
