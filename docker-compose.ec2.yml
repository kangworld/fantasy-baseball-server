services:
  app:
    build:
      context: .
    image: fantasy-baseball-server:latest
    container_name: fantasy-baseball-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AWS_REGION: ap-northeast-2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: fantasy-baseball-mysql
    environment:
      MYSQL_DATABASE: fantasy_baseball
      MYSQL_USER: ${MYSQL_USER:-fantasy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fantasy}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fantasy-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: fantasy-baseball-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
